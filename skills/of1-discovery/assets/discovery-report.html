<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discovery — {{DOMAIN}}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1C1917;
  --fg: #F5F0E8;
  --accent: #FF3D00;
  --teal: #00E5A0;
  --fg-dim: rgba(245, 240, 232, 0.55);
  --faint: rgba(245, 240, 232, 0.06);
  --border: rgba(245, 240, 232, 0.1);
  --font: 'JetBrains Mono', monospace;
  --heading-font: 'Cormorant Garamond', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 12px; line-height: 1.65; padding: 40px 24px; max-width: 960px; margin: 0 auto; }
h1 { font-family: var(--heading-font); font-size: 32px; font-weight: 600; margin-bottom: 4px; }
.sub { color: var(--fg-dim); margin-bottom: 32px; }
h2 { font-family: var(--heading-font); font-size: 22px; font-weight: 600; color: var(--teal); margin: 32px 0 12px; }
h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); margin: 20px 0 8px; }
p { margin: 0 0 12px; }
ul { list-style: none; margin: 0 0 16px; padding: 0; }
li { padding: 3px 0 3px 16px; position: relative; color: var(--fg); }
li::before { content: "→"; position: absolute; left: 0; color: var(--teal); }
a { color: var(--teal); text-decoration: none; border-bottom: 1px solid rgba(0, 229, 160, 0.3); }
a:hover { border-bottom-color: var(--teal); }
strong { color: var(--fg); font-weight: 600; }
.report section { border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; background: var(--faint); }
.shots { display: flex; flex-direction: column; gap: 24px; margin: 8px 0 8px; }
.shot figure { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #000; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { font-size: 10px; color: var(--fg-dim); padding: 8px 12px; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<h1>Discovery: <span style="color:var(--accent)">{{DOMAIN}}</span></h1>
<p class="sub">Proposed demo focus, narrative, and key pages — captured from a bounded crawl of the live site.</p>

<h2>Screenshots</h2>
<div class="shots">{{SCREENSHOTS_HTML}}</div>

<h2>Analysis</h2>
<div class="report">{{REPORT_HTML}}</div>
</body>
</html>
